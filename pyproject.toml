[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo"
version = "1.3.0"
description = "Mnemo: a compiler from a reversible C subset to Kairos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pycparser>=2.22,<3",
]

[project.scripts]
mnemo = "mnemo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mnemo*"]

[tool.setuptools.package-data]
mnemo = ["*.c", "lib/*.kairos", "fake_include/*.h"]
